# One detector run. The ablation ladder changes one line at a time:
#   frozen head        : features=true
#   + LoRA             : features=false lora_rank=16
#   + FiLM / block A   : film=true
#   full fine-tune     : features=false unfreeze=true
name: ???                 # run name; experiments/runs/<name> must not exist
features: true            # true: train the head on cached features of the frozen backbone
views: [clean, codec]     # features=true: cached train views (clean, codec, encodec)
val_views: [clean, codec] # features=true: dev views to validate on; selection = their mean EER
band: null                # [start, stop): restrict the head to this slice of backbone layers
backend: head             # head (time-mean + layer weighting), or a FRAME back-end:
                          #   mhfa  attentive pooling over frames
                          #   lfcc  frames + 60-dim cepstra from the waveform
                          #   graph graph attention over time and layer nodes
film: false               # block A (codec-supervised condition vector) + FiLM
lora_rank: 0              # features=false only
unfreeze: false           # features=false only: fine-tune the whole backbone
rawboost: false           # features=false only: RawBoost on the training crops
codec_p: 0.5              # features=false only: probability of a simulated codec per training crop
crop_seconds: 4.0         # features=false only: random training crop
val_n: 6000               # features=false only: validation clips drawn from the dev select split
epochs: 30
patience: 30             # >= epochs: the one-cycle schedule must finish; the best epoch is still the one kept
select_window: 1         # epochs averaged to choose the kept epoch; 3 was tested and rejected (log, 2026-10-10)
batch_size: 512
lr: 1.0e-3                # head
backbone_lr: 1.0e-5       # LoRA / unfrozen backbone
weight_decay: 1.0e-2
dropout: 0.2
encodec_p: 0.0            # features=false only: fraction of each training batch put through EnCodec
adv_eps: 0.0              # >0: feature-space adversarial training, as a fraction of the feature norm
adv_steps: 3              # PGD steps used to craft each batch's perturbation
cond_weight: 0.5
score_only: false         # re-score a FINISHED run: load its model.pt, train nothing
score_sets: [dev_clean, dev_codec, eval_clean]   # scored with the best checkpoint

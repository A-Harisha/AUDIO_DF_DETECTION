[project]
name = "caesd"
version = "0.0.1"
description = "Condition-Aware Evidence for Speech Deepfake Detection"
readme = "README.md"
requires-python = ">=3.12,<3.13"
authors = [{ name = "Harisha" }]
dependencies = [
    "torch>=2.5",
    "torchaudio>=2.5",
    "transformers>=4.44",
    "peft>=0.13",
    "hydra-core>=1.3",
    "numpy>=1.26",
    "scipy>=1.13",
    "scikit-learn>=1.5",
    "soundfile>=0.12",
    "pandas>=2.2",
    "tqdm>=4.66",
    "huggingface-hub>=0.25",
    "datasets>=3.0",
    "tensorboard>=2.17",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/caesd"]

# --- CUDA PyTorch wheels for the RTX 3090 Ti (Ampere, sm_86) ---
[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }
torchaudio = { index = "pytorch-cu124" }

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["obsolete"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
]
